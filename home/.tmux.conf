# General
set -s extended-keys on
set -s focus-events on
set -g bell-action none
set -g mouse on

set -s history-file ~/.tmux_history
set -s prompt-history-limit 8192
set -g history-limit 100000

set -g mode-keys vi
set -g status-keys emacs

set -g cursor-style block
set -g prompt-cursor-style block

set -g set-titles on
set -g set-titles-string '#S:#W'

# Mappings
set -g prefix C-Space
bind C-Space send-prefix
unbind C-b

bind -T copy-mode-vi v     send-keys -X begin-selection
bind -T copy-mode-vi V     send-keys -X select-line
bind -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind -T copy-mode-vi y     send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi 0     send-keys -X back-to-indentation
bind -T copy-mode-vi '$'   send-keys -X end-of-line
bind -T copy-mode-vi PPage send-keys -X halfpage-up
bind -T copy-mode-vi NPage send-keys -X halfpage-down

bind e command-prompt -p 'Session name:' { new-session -s '%%' -c '#{pane_current_path}' }
bind r command-prompt -I '#S' -p 'Session name:' { rename-session '%%' }
bind b choose-tree -Zs

bind v split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Tab last-pane

# Statusline
set -g mode-style 'bg=#304a3d,fg=#dcdccc'
set -g status-style 'bg=#1f1f1f,fg=#dcdccc'
set -g window-status-current-style 'bold,fg=#ccd990'

set -g status-left-length 60
set -g status-left '#[bold,fg=#ccd990][#S]#[default]#{S: #S,} ╎ '

set -g status-right-length 80
set -g status-right ''
set -ag status-right '#{?client_prefix,[PREFIX],}'
set -ag status-right '#{?pane_in_mode,[#{pane_mode}],}'
set -ag status-right '#{?#{&&:#{pane_in_mode},#{pane_unseen_changes}},[NEW OUTPUT],}'
set -ag status-right '#{?window_zoomed_flag,#[bold][ZOOM]#[nobold],}'
set -ag status-right '#{?session_many_attached,#[bold][SHARED]#[nobold],}'
